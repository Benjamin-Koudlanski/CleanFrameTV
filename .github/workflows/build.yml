name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q CleanFrameTV.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: CleanFrameTV
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp CleanFrameTV/app/build/outputs/apk/debug/app-debug.apk CleanFrameTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrameTV-apk
          path: CleanFrameTV.apk
      - name: Publish release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: CleanFrameTV.apk
